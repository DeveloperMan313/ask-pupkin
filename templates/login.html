{% extends 'layouts/base.html' %}

{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<h1>Log In</h1>

<form method="post" class="mt-3 fs-5" style="max-width: 30em;">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Log in" class="btn btn-primary px-4">
</form>

<p class="mt-4"><a href="{% url 'signup' %}">sign up</a></p>
{% endblock %}
