{% extends 'layouts/base.html' %}

{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<h1>Settings</h1>

<form method="post" enctype="multipart/form-data" class="mt-3 fs-5" style="max-width: 30em;">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Save" class="btn btn-primary px-4">
</form>
{% endblock %}
