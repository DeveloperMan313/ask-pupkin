{% load static %}

<div class="rating-area w-50 my-3" data-type="question" data-id="{{ question.pk }}"
    data-user-rating="{{ question.user_rating }}">
    <p class="rating mb-0">{{ question.rating }}</p>
    <img src="{% static 'svg/triangle-up.svg' %}" alt="dislike" class="dislike-btn me-2" style="transform: rotate(180deg);"><img src="{% static 'svg/triangle-up.svg' %}" alt="like" class="like-btn">
</div>
